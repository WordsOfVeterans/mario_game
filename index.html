<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mario Walking Animation</title>

    <style>

        body {
            margin: 0;
            background: skyblue;
            overflow: hidden;
        }

        /* Ground */
        .ground {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100px;
            background: green;
        }

        /* Mario */
        .mario {
            width: 90px;
            height: 110px;

            background-image: url("Mario.png");
            background-repeat: no-repeat;
            background-size: 270px 110px;

            position: absolute;
            bottom: 100px;
            left: 0;

            /* 3 walking frames + movement */
            animation:
                walk 0.6s steps(3) infinite,
                move 5s linear infinite;
        }

        /* Mario walking animation */
        @keyframes walk {

            from {
                background-position: 0 0;
            }

            to {
                background-position: -270px 0;
            }
        }

        /* Move Mario across the screen */
        @keyframes move {

            from {
                left: 0;
            }

            to {
                left: calc(100% - 90px);
            }
        }

    </style>
</head>

<body>

    <div class="mario"></div>

    <div class="ground"></div>

</body>

</html>
